server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-threads: 200
    uri-encoding: UTF-8

spring:
  application:
    name: djbh-system
  profiles:
    active: dev

  # 强制UTF-8编码
  mandatory-charset: UTF-8
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 缓存
  cache:
    type: simple

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gydl.djbh.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 应用自定义配置
app:
  # JWT配置
  jwt:
    secret: ${APP_JWT_SECRET:djbh-system-jwt-secret-key-2026-minimum-256-bits}
    expiration: 28800  # 8小时，单位秒
    header: Authorization
    prefix: Bearer

  # 文件存储路径
  file:
    template-path: ${FILE_TEMPLATE_PATH:./data/templates/}
    archive-path: ${FILE_ARCHIVE_PATH:./data/archives/}
    allowed-types: doc,docx,xls,xlsx,pdf,png,jpg,jpeg

  # 应用根密钥（用于加密SM4/HMAC密钥本身，通过环境变量注入）
  crypto:
    root-key: ${APP_ROOT_KEY:djbh-root-key-change-in-production-env}

  # 跨域配置（允许所有来源，包括sandbox外网访问）
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    max-age: 3600

# 日志
logging:
  level:
    com.gydl.djbh: DEBUG
    org.springframework.security: INFO
  file:
    name: ./logs/djbh-system.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
