pid /home/user/webapp/nginx.pid;
error_log /home/user/webapp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /home/user/webapp/nginx-access.log;

    server {
        listen 3000;
        server_name _;
        root /home/user/webapp/frontend/dist;
        index index.html;

        # API proxy to Spring Boot backend
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            client_max_body_size 100m;
        }

        # Vue Router history mode fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
